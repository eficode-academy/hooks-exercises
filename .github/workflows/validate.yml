name: Validate hook exercises

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bash: true
          - os: macos-latest
            bash: true
          - os: windows-latest
            bash: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Bash track (scripts, fixtures, docs)
        if: matrix.bash
        run: |
          bash tests/run.sh
          bash tests/docs.sh
      - name: PowerShell track (scripts, fixtures, doc commands)
        shell: pwsh
        run: ./tests/run.ps1
